name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Performance runner regressions
        run: bash scripts/tests/performance-gates-regression.sh
      - name: Serial performance gates
        run: bash scripts/tests/performance-gates.sh
      - name: Release build
        run: cargo build --release --locked
